# Быстрый gate: unit-тесты на каждый push / PR (без portable-сборки).
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - asr: false
            features: ""
            cache_key: default
          - asr: true
            features: "--features asr"
            cache_key: asr
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (egui)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgtk-3-dev \
            libssl-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.cache_key }}

      - name: Fetch Vosk Linux natives
        if: matrix.asr
        run: ./scripts/fetch-vosk-linux.sh

      - name: cargo test
        run: cargo test ${{ matrix.features }}
