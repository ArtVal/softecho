# Portable-сборка под Windows (x86_64), без установщика.
name: windows-portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - asr: false
            suffix: text
          - asr: true
            suffix: asr

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          chmod +x scripts/version.sh
          ./scripts/version.sh check-tag

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: win-${{ matrix.suffix }}

      - name: Fetch Vosk Windows natives
        if: matrix.asr
        shell: bash
        run: ./scripts/fetch-vosk-windows.sh

      - name: Build release (text)
        if: ${{ !matrix.asr }}
        run: cargo build --release

      - name: Build release (asr)
        if: matrix.asr
        run: cargo build --release --features asr

      - name: Package portable zip
        shell: bash
        env:
          SKIP_BUILD: "1"
        run: |
          set -euo pipefail
          ARGS=
          if [[ "${{ matrix.asr }}" == "true" ]]; then
            ARGS=--asr
          fi
          ./scripts/package-windows-portable.sh $ARGS
          ls -la dist/

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Package Windows installer
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/package-windows-installer.sh
          ARGS=
          if [[ "${{ matrix.asr }}" == "true" ]]; then
            ARGS=--asr
          fi
          ./scripts/package-windows-installer.sh $ARGS
          ls -la dist/*.exe

      - name: Verify ASR portable includes MinGW runtime
        if: matrix.asr
        shell: bash
        run: |
          set -euo pipefail
          # Проверяем папку (надежнее unzip на Windows runner) и что zip не пустой.
          out="dist/softecho-windows-x86_64-asr"
          zip="dist/softecho-windows-x86_64-asr.zip"
          test -d "$out"
          test -f "$zip"
          ls -la "$out"
          for f in softecho.exe libvosk.dll libwinpthread-1.dll libgcc_s_seh-1.dll 'libstdc++-6.dll'; do
            test -f "$out/$f" || { echo "В $out нет $f" >&2; exit 1; }
          done
          dll_count="$(find "$out" -maxdepth 1 -type f -name '*.dll' | wc -l | tr -d ' ')"
          if [[ "$dll_count" -lt 4 ]]; then
            echo "В $out слишком мало .dll ($dll_count)" >&2
            exit 1
          fi
          # Содержимое zip без unzip: tar умеет читать .zip через -a / bsdtar.
          if tar -tf "$zip" >/tmp/asr-zip.list 2>/dev/null || tar -a -tf "$zip" >/tmp/asr-zip.list 2>/dev/null; then
            for f in libvosk.dll libwinpthread-1.dll libgcc_s_seh-1.dll 'libstdc++-6.dll'; do
              grep -F "$f" /tmp/asr-zip.list >/dev/null || { echo "В $zip нет $f" >&2; cat /tmp/asr-zip.list >&2; exit 1; }
            done
          else
            echo "Предупреждение: не удалось прочитать список zip (папка уже проверена)" >&2
          fi
          echo "OK: portable ASR ($dll_count .dll, zip $(wc -c < "$zip") bytes)"

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: softecho-windows-x86_64-${{ matrix.suffix }}
          # Папка, не .zip: GitHub и так заворачивает артефакт в zip —
          # иначе получается zip внутри zip.
          path: dist/softecho-windows-x86_64-${{ matrix.suffix }}/
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: softecho-windows-x86_64-setup-${{ matrix.suffix }}
          path: dist/softecho-windows-x86_64-setup-${{ matrix.suffix }}.exe
          if-no-files-found: error

  release:
    name: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Pack zip and installer for Release
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for dir in artifacts/softecho-windows-x86_64-text artifacts/softecho-windows-x86_64-asr; do
            [[ -d "$dir" ]] || continue
            name="$(basename "$dir")"
            (cd artifacts && zip -r -q "../dist/${name}.zip" "$name")
            ls -lh "dist/${name}.zip"
          done
          find artifacts -type f -name 'softecho-windows-x86_64-setup-*.exe' -print -exec cp -v {} dist/ \;
          test -n "$(ls -A dist 2>/dev/null)" || { echo "Нет архивов/setup" >&2; exit 1; }
          ls -lh dist/
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ls -la dist/
          shopt -s nullglob
          files=(dist/*.zip dist/*.exe)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "Нет zip/exe в dist/" >&2
            exit 1
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --generate-notes --title "SoftEcho ${tag}" || true
          fi
          gh release upload "$tag" "${files[@]}" --clobber
