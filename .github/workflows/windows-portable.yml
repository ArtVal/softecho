# Portable-сборка под Windows (x86_64), без установщика.
name: windows-portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - asr: false
            suffix: text
          - asr: true
            suffix: asr

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: win-${{ matrix.suffix }}

      - name: Fetch Vosk Windows natives
        if: matrix.asr
        shell: bash
        run: ./scripts/fetch-vosk-windows.sh

      - name: Build release (text)
        if: ${{ !matrix.asr }}
        run: cargo build --release

      - name: Build release (asr)
        if: matrix.asr
        run: cargo build --release --features asr

      - name: Package portable zip
        shell: bash
        env:
          SKIP_BUILD: "1"
        run: |
          set -euo pipefail
          ARGS=
          if [[ "${{ matrix.asr }}" == "true" ]]; then
            ARGS=--asr
          fi
          ./scripts/package-windows-portable.sh $ARGS
          ls -la dist/

      - name: Verify ASR zip includes MinGW runtime
        if: matrix.asr
        shell: bash
        run: |
          set -euo pipefail
          zip="dist/softecho-windows-x86_64-asr.zip"
          test -f "$zip"
          for f in softecho.exe libvosk.dll libwinpthread-1.dll libgcc_s_seh-1.dll libstdc++-6.dll; do
            unzip -l "$zip" | grep -F "$f" >/dev/null || { echo "В $zip нет $f" >&2; exit 1; }
          done
          dll_count="$(unzip -l "$zip" | grep -E '\.dll$' | wc -l | tr -d ' ')"
          if [[ "$dll_count" -lt 4 ]]; then
            echo "В $zip слишком мало .dll ($dll_count)" >&2
            exit 1
          fi
          echo "OK: portable ASR zip ($dll_count .dll)"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: softecho-windows-x86_64-${{ matrix.suffix }}
          path: dist/softecho-windows-x86_64-${{ matrix.suffix }}.zip
          if-no-files-found: error
