# Portable-сборка под macOS (Apple Silicon), без установщика.
name: macos-portable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - asr: false
            suffix: text
          - asr: true
            suffix: asr

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.suffix }}

      - name: Fetch Vosk macOS natives
        if: matrix.asr
        run: ./scripts/fetch-vosk-macos.sh

      - name: Build release (text)
        if: ${{ !matrix.asr }}
        run: cargo build --release

      - name: Build release (asr)
        if: matrix.asr
        run: cargo build --release --features asr

      - name: Package portable tar.gz
        env:
          SKIP_BUILD: "1"
        run: |
          set -euo pipefail
          chmod +x scripts/package-macos-portable.sh
          ARGS=
          if [[ "${{ matrix.asr }}" == "true" ]]; then
            ARGS=--asr
          fi
          ./scripts/package-macos-portable.sh $ARGS
          ls -la dist/

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: softecho-macos-aarch64-${{ matrix.suffix }}
          # Папка, не .tar.gz: иначе Actions даёт zip с tar.gz внутри.
          path: dist/softecho-macos-aarch64-${{ matrix.suffix }}/
          if-no-files-found: error

  release:
    name: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Pack tar.gz for Release
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for dir in artifacts/softecho-macos-aarch64-*/; do
            name="$(basename "$dir")"
            tar -czf "dist/${name}.tar.gz" -C artifacts "$name"
            ls -lh "dist/${name}.tar.gz"
          done
          test -n "$(ls -A dist)" || { echo "Нет архивов" >&2; exit 1; }
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ls -la dist/
          shopt -s nullglob
          files=(dist/*.tar.gz)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "Нет tar.gz в dist/" >&2
            exit 1
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --generate-notes --title "SoftEcho ${tag}" || true
          fi
          gh release upload "$tag" "${files[@]}" --clobber
