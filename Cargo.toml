[package]
name = "softecho"
version = "0.1.0"
edition = "2021"
description = "SoftEcho — домашний десктоп-тренажёр речи (офлайн)"
license = "MIT"
default-run = "softecho"

[features]
default = []
asr = ["dep:vosk", "dep:cpal"]

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
rand = "0.9"
ureq = "2.11"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Опционально: офлайн-распознавание (фаза 2)
vosk = { version = "0.3", optional = true }
cpal = { version = "0.15", optional = true }

[profile.release]
lto = true
codegen-units = 1
